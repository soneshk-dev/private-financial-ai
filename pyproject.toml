[project]
name = "homeai"
version = "0.1.0"
description = "Private, local-first personal finance ledger with connectors, a read API, and a small CLI."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "cryptography>=42",
]

[project.optional-dependencies]
plaid = ["plaid-python>=38"]
bitcoin = ["bip-utils>=2.9", "base58>=2.1"]
mcp = ["mcp>=1.10,<2"]
dev = ["pytest>=8", "pytest-cov>=5"]
all = ["homeai[plaid,bitcoin,mcp,dev]"]

[project.scripts]
homeai = "homeai.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["homeai*"]

[tool.setuptools.package-data]
homeai = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
